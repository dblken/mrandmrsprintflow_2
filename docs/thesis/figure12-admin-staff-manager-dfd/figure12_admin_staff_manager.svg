<title id="title">Figure 12. Admin, Staff, and Manager Data Flow</title>
<desc id="desc">A single Level 1 DFD for PrintFlow. External entities are Admin, Staff, Customer, Manager, and PayMongo. Eight numbered processes exchange labeled data with seven logical stores. Stock checking, production assignment, and later inventory issue are shown as distinct steps.</desc>
